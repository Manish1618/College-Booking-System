[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"config/test_settings.py" = ["S", "E402"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]
