name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guesthouse
          POSTGRES_USER: guesthouse
          POSTGRES_PASSWORD: guesthouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guesthouse" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://guesthouse:guesthouse@localhost:5432/guesthouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Static security analysis
        run: bandit -q -r apps config -ll
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings config.test_settings
      - name: Tests (80% coverage required)
        run: pytest --cov=apps --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t guesthouse-${{ matrix.service }}:ci ${{ matrix.service }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: guesthouse-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
